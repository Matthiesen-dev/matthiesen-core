name: Branch from Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name to create a branch from'
        required: true
        default: 'v1.0.0'
      target_branch:
        description: 'The name of the branch to create'
        required: true
        default: 'release-v1.0.0'

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create branch from tag
        run: |
          git checkout tags/${{ github.event.inputs.tag_name }} -b ${{ github.event.inputs.target_branch }}
          git push origin ${{ github.event.inputs.target_branch }}