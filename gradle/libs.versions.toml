[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
architectury-loom = { id = "dev.architectury.loom", version.ref = "architectury-loom" }
architectury-plugin = { id = "architectury-plugin", version.ref = "architectury-plugin" }

[libraries]
publish = { group = "com.vanniktech", name = "gradle-maven-publish-plugin", version.ref = "publish" }
kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
architectury-loom = { group = "dev.architectury", name = "architectury-loom", version.ref = "architectury-loom" }
architectury-plugin = { group = "architectury-plugin", name = "architectury-plugin.gradle.plugin", version.ref = "architectury-plugin" }
shadow-gradle = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
minecraft-net = { group = "net.minecraft", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-permissions-api = { group = "me.lucko", name = "fabric-permissions-api", version.ref = "fabric-permissions-api" }
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
sponge-mixin = { group = "org.spongepowered", name = "mixin", version.ref = "sponge-mixin" }
faststats = { group = "dev.matthiesen.libs", name = "faststats", version.ref = "faststats" }
emberstextapiFabric = { group = "net.tysontheember.emberstextapi", name = "emberstextapi-fabric-1.21.1", version.ref = "emberstextapi" }
emberstextapiNeoForge = { group = "net.tysontheember.emberstextapi", name = "emberstextapi-neoforge-1.21.1", version.ref = "emberstextapi" }
modmenu = { group = "maven.modrinth", name = "mOgUt4GM", version.ref = "modmenu" }
impactor-fabric = { group = "maven.modrinth", name = "impactor", version.ref = "impactor-fabric" }
impactor-neoforge = { group = "maven.modrinth", name = "impactor", version.ref = "impactor-neoforge" }
adventure-key = { group = "net.kyori", name = "adventure-key", version.ref = "adventure-key" }
luckperms-api = { group = "net.luckperms", name = "api", version.ref = "luckperms" }
luckperms-fabric = { group = "maven.modrinth", name = "luckperms", version.ref = "luckperms-fabric" }
luckperms-neoforge = { group = "maven.modrinth", name = "luckperms", version.ref = "luckperms-neoforge" }

[bundles]
commonCompileOnly = ["sponge-mixin", "luckperms-api"]
commonImplementation = ["faststats", "adventure-key"]
commonModCompileOnly = ["emberstextapiFabric", "impactor-fabric"]
commonModImplementation = []
commonModImplementationNoTransitive = []

fabricCompileOnly = []
fabricImplementation = ["faststats"]
fabricModCompileOnly = ["fabric-permissions-api", "emberstextapiFabric", "impactor-fabric", "luckperms-fabric"]
fabricModRuntimeOnly = ["emberstextapiFabric", "modmenu"]
fabricModImplementation = ["fabric-loader", "fabric-api"]
fabricModImplementationNoTransitive = []

neoforgeCompileOnly = []
neoforgeImplementation = ["faststats"]
neoforgeModCompileOnly = ["emberstextapiNeoForge", "impactor-neoforge", "luckperms-neoforge"]
neoforgeModRuntimeOnly = ["emberstextapiNeoForge"]
neoforgeModImplementation = []
neoforgeModImplementationNoTransitive = []