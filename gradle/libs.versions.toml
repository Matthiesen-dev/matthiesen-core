fabric-permissions-api = "0.3.1"
neoforge = "21.1.182"
junit = "5.1.0"
publish = "0.35.0"
sponge-mixin = "0.8.5"
faststats = "0.29.1"
emberstextapi = "3.0.0"
modmenu = "v6Xx3fbU"
